name: exponential
prefix: xpo
default_branch: main
version: 3
worktrees: true
estimation_system: fibonacci
count_unestimated: true
automations:
    first_start: true
    last_completed: true
default_labels:
    - bug
    - feature
    - epic
    - improvement
labels:
    bug: "#eb5757"
    feature: "#b36cd9"
    epic: "#5e6ad2"
    improvement: "#4da6e8"
    CLI: "#26b5b0"
    Backend: "#e07058"
    WebApp: "#e06091"
    Documentation: "#d4a030"
cycles:
    enabled: true
    duration: 2w
    start_day: monday
drive:
    supervisor:
        agent: claude
        model: sonnet
    coder:
        agent: claude
    max_retries: 3
    timeout: 30m
