name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd web && bun run build
          mkdir -p ../internal/server/static
          cp -r dist/* ../internal/server/static/

      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: internal/server/static/
          retention-days: 1

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: internal/server/static/

      - name: Build and package binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -o xpo${EXT} ./cmd/exponential
          if [ "$GOOS" = "windows" ]; then
            zip xpo-${GOOS}-${GOARCH}.zip xpo${EXT}
          else
            tar czf xpo-${GOOS}-${GOARCH}.tar.gz xpo${EXT}
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: xpo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            xpo-*.tar.gz
            xpo-*.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: xpo-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum xpo-*.tar.gz xpo-*.zip > checksums.txt

      - name: Extract changelog for this release
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            xpo-*.tar.gz
            xpo-*.zip
            checksums.txt
