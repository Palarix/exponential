name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd web && bun run build
          mkdir -p ../internal/server/static
          cp -r dist/* ../internal/server/static/

      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: internal/server/static/
          retention-days: 1

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: internal/server/static/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -o beats-${GOOS}-${GOARCH}${EXT} ./cmd/beats

      - uses: actions/upload-artifact@v6
        with:
          name: beats-${{ matrix.goos }}-${{ matrix.goarch }}
          path: beats-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: beats-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: beats-*
